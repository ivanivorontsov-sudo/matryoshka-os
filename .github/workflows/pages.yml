name: Deploy Matryoshka site to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "favicon.svg"
      - "robots.txt"
      - "sitemap.xml"
      - "features/**"
      - "download/**"
      - "installation/**"
      - "en/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          mkdir -p _site
          cp index.html robots.txt sitemap.xml favicon.svg _site/
          cp -R features download installation en _site/
          if [ -n "$INDEXNOW_KEY" ]; then
            case "$INDEXNOW_KEY" in *[!a-zA-Z0-9-]* ) echo "Invalid IndexNow key format"; exit 1;; esac
            if [ ${#INDEXNOW_KEY} -lt 8 ] || [ ${#INDEXNOW_KEY} -gt 128 ]; then echo "Invalid IndexNow key length"; exit 1; fi
            printf '%s' "$INDEXNOW_KEY" > "_site/${INDEXNOW_KEY}.txt"
          fi
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify Yandex and IndexNow about updated pages
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        if: ${{ env.INDEXNOW_KEY != '' }}
        run: |
          payload=$(jq -n \
            --arg host "ivanivorontsov-sudo.github.io" \
            --arg key "$INDEXNOW_KEY" \
            --arg keyLocation "https://ivanivorontsov-sudo.github.io/matryoshka-os/${INDEXNOW_KEY}.txt" \
            --argjson urls '[
              "https://ivanivorontsov-sudo.github.io/matryoshka-os/",
              "https://ivanivorontsov-sudo.github.io/matryoshka-os/features/",
              "https://ivanivorontsov-sudo.github.io/matryoshka-os/download/",
              "https://ivanivorontsov-sudo.github.io/matryoshka-os/installation/",
              "https://ivanivorontsov-sudo.github.io/matryoshka-os/en/",
              "https://ivanivorontsov-sudo.github.io/matryoshka-os/en/features/",
              "https://ivanivorontsov-sudo.github.io/matryoshka-os/en/download/",
              "https://ivanivorontsov-sudo.github.io/matryoshka-os/en/installation/"
            ]' \
            '{host:$host,key:$key,keyLocation:$keyLocation,urlList:$urls}')
          curl --fail-with-body --silent --show-error \
            -X POST "https://yandex.com/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data-binary "$payload"
