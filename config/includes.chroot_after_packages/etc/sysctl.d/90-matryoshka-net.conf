# Сверка с рекомендациями Google BBR, ESnet и документацией ядра 6.12 (2026).
# BBR из ядра Debian — это BBRv1. BBRv3 в это ядро не входит, чужое ядро не ставим:
# на ноутбуке оно ломает Wi-Fi, сканер и графику, а на части линий BBRv3 ещё и медленнее.
# Для BBR очередь fq, не cake и не pfifo. Буферы не раздуваем до 64 МБ: это совет для
# канала 10 Гбит, на раздаче с телефона такая очередь только растит задержку.
# Значение 2 включает зонд всегда и на части сетей замедляет. 1 включает его,
# только когда крупные пакеты пропадают. 0 для всей системы не ставить: прошлый архив
# так и сделал из сети Android, и интернет компьютера стал крайне медленным.
net.core.default_qdisc=fq
net.ipv4.tcp_congestion_control=bbr
# 1 = только исходящий Fast Open. Значение 3 включало ещё приём и на части сетей обрывало соединения.
net.ipv4.tcp_fastopen=1
net.ipv4.tcp_mtu_probing=1
net.ipv4.tcp_slow_start_after_idle=0
# Не раздувает буферы дальше прежних: большие буферы увеличивают задержку.
net.ipv4.tcp_notsent_lowat=131072
net.core.rmem_max=16777216
net.core.wmem_max=16777216
net.ipv4.tcp_rmem=4096 131072 16777216
net.ipv4.tcp_wmem=4096 65536 16777216
net.ipv6.conf.all.use_tempaddr=2
net.ipv6.conf.default.use_tempaddr=2
