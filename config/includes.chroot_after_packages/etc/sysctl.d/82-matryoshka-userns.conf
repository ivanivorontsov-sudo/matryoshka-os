# Вход в Zoom открывает своё окно Chromium. В Debian 13 ядро по умолчанию
# запрещает такому окну песочницу. Окно входа не появляется, клиент не доходит
# до сервера и показывает 100000400 (Meeting join failed — так тот же сбой
# назван у клиента Windows). Упакованный Firefox и Chromium Debian имеют
# своё разрешение AppArmor, у Zoom его нет.
kernel.apparmor_restrict_unprivileged_userns=0
