---
mountOptions:
    default: defaults,noatime
    btrfs: defaults,noatime
    efi: defaults,umask=0077,nofail,x-systemd.device-timeout=5s
    vfat: defaults,umask=0077,nofail,x-systemd.device-timeout=5s
ssdExtraMountOptions:
    ext4: discard
    jfs: discard
    xfs: discard
    swap: discard
    btrfs: discard,compress=lzo
crypttabOptions: luks,discard,keyscript=/bin/cat
