[Service]
# BlueZ 5.82 в Debian 13 собран с LimitNPROC=1. Поток адаптера не создаётся,
# процесс сразу выходит, и на чёрном экране загрузки написано failed, Bluetooth.
LimitNPROC=infinity
# Запрет исполняемой памяти роняет bluetoothd до появления адаптера.
MemoryDenyWriteExecute=false
# Профиль SAP без сотового модема завершает службу с ошибкой.
ExecStart=
ExecStart=/usr/libexec/bluetooth/bluetoothd --noplugin=sap
Restart=on-failure
RestartSec=1
