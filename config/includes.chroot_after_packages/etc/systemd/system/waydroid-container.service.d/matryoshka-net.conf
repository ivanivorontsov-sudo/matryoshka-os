[Service]
# До старта контейнера: Яндекс Браузер рисует страницы через SwiftShader,
# иначе virgl роняет вкладку с текстом «That was unexpected».
ExecStartPre=-/usr/lib/matryoshka/android-gl.sh
# Контейнер поднимает мост сам. Сразу после этого, уже с правами администратора,
# выключаются ложные суммы veth и DNS уводится с 127.0.0.53.
ExecStartPost=-/usr/bin/python3 /usr/lib/matryoshka/waydroid_net.py apply
