set color_normal=light-gray/blue
set color_highlight=white/blue
set menu_color_normal=light-gray/blue
set menu_color_highlight=white/blue

loadfont $prefix/live-theme/dejavu_16.pf2
loadfont $prefix/live-theme/dejavu_b28.pf2
set gfxmode=auto
insmod all_video
insmod gfxterm
terminal_output gfxterm

if [ -e /boot/grub/splash.png ]; then
    set theme=/boot/grub/live-theme/theme.txt
fi
