source /boot/grub/config.cfg
source /boot/grub/theme.cfg
set timeout=8

if [ "$matryoshka_lang" = "en" ]; then
	set m1="Matryoshka"
	set m2="Matryoshka — simple mode (no animations)"
	set m3="Install to disk (system is copied into memory)"
	set m4="Recover files (disks are read-only)"
	set m5="Update Matryoshka (system into memory)"
	set m6="Safe mode"
	set m7="Factory mode (drop saved changes)"
	set m8="Tools..."
	set m9="UEFI settings"
	set m10="Check the media"
	set mlang="Русский"
	set mnext="ru"
else
	set m1="Матрёшка"
	set m2="Матрёшка — простой режим (без анимаций)"
	set m3="Установка на диск (система копируется в память)"
	set m4="Восстановление файлов (диски только для чтения)"
	set m5="Обновить Матрёшку (система в память)"
	set m6="Безопасный режим"
	set m7="Заводской режим (без сохранённых изменений, сброс)"
	set m8="Служебное..."
	set m9="Настройки UEFI"
	set m10="Проверка носителя"
	set mlang="English"
	set mnext="en"
fi

menuentry "$m1" --hotkey=m {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}
menuentry "$m2" --hotkey=p {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ matryoshka.simple
	initrd	@INITRD_LIVE@
}
menuentry "$m3" --hotkey=i {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ toram matryoshka.install
	initrd	@INITRD_LIVE@
}
menuentry "$m4" --hotkey=r {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ nopersistence matryoshka.recover
	initrd	@INITRD_LIVE@
}
menuentry "$m5" {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ toram matryoshka.update
	initrd	@INITRD_LIVE@
}
menuentry "$m6" --hotkey=s {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ matryoshka.safe nomodeset
	initrd	@INITRD_LIVE@
}
menuentry "$m7" --hotkey=f {
	linux	@KERNEL_LIVE@ boot=live components quiet locales=ru_RU.UTF-8 keyboard-layouts=us,ru keyboard-options=grp:alt_shift_toggle timezone=Asia/Vladivostok hostname=matryoshka username=ivan matryoshka.factory
	initrd	@INITRD_LIVE@
}
submenu "$m8" --hotkey=u {
	source /boot/grub/theme.cfg
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "$m9" {
			fwsetup
		}
	fi
	menuentry "$m10" {
		linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
		initrd	@INITRD_LIVE@
	}
}
menuentry "$mlang" {
	set matryoshka_lang=$mnext
	export matryoshka_lang
	configfile $prefix/grub.cfg
}
