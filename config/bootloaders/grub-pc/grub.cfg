source /boot/grub/config.cfg
set timeout=8

menuentry "Матрёшка" --hotkey=m {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}
menuentry "Матрёшка — простой режим (без анимаций)" --hotkey=p {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ matryoshka.simple
	initrd	@INITRD_LIVE@
}
menuentry "Установка на диск (система копируется в память)" --hotkey=i {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ toram matryoshka.install
	initrd	@INITRD_LIVE@
}
menuentry "Безопасный режим" --hotkey=s {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ matryoshka.safe nomodeset
	initrd	@INITRD_LIVE@
}
menuentry "Заводской режим (без сохранённых изменений, сброс)" --hotkey=f {
	linux	@KERNEL_LIVE@ boot=live components quiet locales=ru_RU.UTF-8 keyboard-layouts=us,ru keyboard-options=grp:alt_shift_toggle timezone=Asia/Vladivostok hostname=matryoshka username=ivan matryoshka.factory
	initrd	@INITRD_LIVE@
}
submenu "Служебное..." --hotkey=u {
	source /boot/grub/theme.cfg
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "Настройки UEFI" {
			fwsetup
		}
	fi
	menuentry "Проверка носителя" {
		linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
		initrd	@INITRD_LIVE@
	}
}
